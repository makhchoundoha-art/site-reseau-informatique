<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cours - Reseaux Informatiques</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .chapter-card {
      background: white;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
      transition: box-shadow 0.2s ease;
      cursor: pointer;
    }
    .chapter-card:hover {
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    .chapter-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .chapter-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #0F172A;
    }
    .chapter-meta {
      display: flex;
      gap: 12px;
      font-size: 0.8rem;
      color: #64748B;
      margin-bottom: 8px;
    }
    .chapter-desc {
      color: #64748B;
      font-size: 0.9rem;
      margin-bottom: 16px;
    }
    .chapter-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chapter-progress {
      flex: 1;
      max-width: 200px;
    }
    .chapter-progress-label {
      font-size: 0.75rem;
      color: #64748B;
      margin-bottom: 4px;
    }

    .chapter-detail {
      background: white;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 32px;
    }
    .chapter-detail h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0F172A;
      margin-bottom: 8px;
    }
    .chapter-detail-meta {
      display: flex;
      gap: 16px;
      color: #64748B;
      font-size: 0.85rem;
      margin-bottom: 24px;
    }
    .chapter-content {
      line-height: 1.8;
      color: #334155;
      margin-bottom: 32px;
    }
    .chapter-content h3 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #0F172A;
      margin: 24px 0 12px;
    }
    .chapter-content h4 {
      font-size: 1rem;
      font-weight: 600;
      color: #0F172A;
      margin: 16px 0 8px;
    }
    .chapter-content strong {
      color: #0F172A;
    }
    .chapter-content code {
      background: #F1F5F9;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.9em;
    }
    .chapter-content pre {
      background: #0F172A;
      color: #E2E8F0;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 12px 0;
    }
    .chapter-content pre code {
      background: none;
      padding: 0;
      color: inherit;
    }
    .chapter-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
    }
    .chapter-content th,
    .chapter-content td {
      border: 1px solid #E2E8F0;
      padding: 10px 14px;
      text-align: left;
    }
    .chapter-content th {
      background: #F8FAFC;
      font-weight: 600;
    }

    .quiz-section {
      background: #F8FAFC;
      border-radius: 12px;
      padding: 24px;
      margin-top: 24px;
    }
    .quiz-section h3 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #0F172A;
      margin-bottom: 20px;
    }
    .quiz-question {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid #E2E8F0;
    }
    .quiz-question:last-child {
      border-bottom: none;
    }
    .quiz-q-text {
      font-weight: 600;
      color: #0F172A;
      margin-bottom: 12px;
    }
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .quiz-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .quiz-option:hover {
      border-color: #3B82F6;
      background: #EFF6FF;
    }
    .quiz-option.selected {
      border-color: #3B82F6;
      background: #DBEAFE;
    }
    .quiz-option.correct {
      border-color: #10B981;
      background: #D1FAE5;
    }
    .quiz-option.incorrect {
      border-color: #EF4444;
      background: #FEE2E2;
    }
    .quiz-option input {
      cursor: pointer;
    }
    .quiz-result {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .quiz-result.correct {
      background: #D1FAE5;
      color: #065F46;
    }
    .quiz-result.incorrect {
      background: #FEE2E2;
      color: #991B1B;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: #64748B;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
    }
    .back-btn:hover {
      color: #3B82F6;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <a href="/">
          <span class="sidebar-brand-icon">R</span>
          Reseaux
        </a>
      </div>
      <nav class="sidebar-nav" id="auth-nav"></nav>
      <div class="sidebar-footer" id="sidebar-footer"></div>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <h2 class="top-bar-title">Cours</h2>
        <button class="mobile-toggle" onclick="toggleMobileSidebar()">
          <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>

      <div class="page-content">
        <div id="chapters-list">
          <p class="card-text">Chargement des chapitres...</p>
        </div>
        <div id="chapter-detail" class="hidden"></div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script>
    let chaptersData = [];
    let currentAnswers = {};

    async function loadChapters() {
      try {
        const data = await apiService.courses.getAll();
        chaptersData = data.chapters || [];
        const container = document.getElementById('chapters-list');
        const user = getUser();
        const completed = user?.completedChapters || [];

        if (chaptersData.length === 0) {
          container.innerHTML = '<p class="card-text">Aucun chapitre disponible.</p>';
          return;
        }

        container.innerHTML = chaptersData.map((ch, idx) => {
          const isDone = completed.includes(ch.id);
          const progress = getChapterProgress(ch.id);
          return `
            <div class="chapter-card" onclick="showChapter('${ch.id}')">
              <div class="chapter-header">
                <div>
                  <div class="chapter-title">${idx + 1}. ${ch.title}</div>
                  <div class="chapter-meta">
                    <span>${ch.duration || '30 min'}</span>
                    <span>${ch.quiz?.length || 0} questions</span>
                    <span>${ch.xpReward || 50} XP</span>
                  </div>
                </div>
                ${isDone ? '<span class="badge badge-blue">Termine</span>' : ''}
              </div>
              <p class="chapter-desc">${ch.description}</p>
              <div class="chapter-footer">
                <div class="chapter-progress">
                  <div class="chapter-progress-label">Progression ${progress}%</div>
                  <div class="progress-container"><div class="progress-fill" style="width:${progress}%"></div></div>
                </div>
                <span class="btn btn-sm btn-primary">Commencer</span>
              </div>
            </div>
          `;
        }).join('');
      } catch (e) {
        document.getElementById('chapters-list').innerHTML = '<p class="alert alert-error">Erreur de chargement.</p>';
      }
    }

    function showChapter(id) {
      const ch = chaptersData.find(c => c.id === id);
      if (!ch) return;
      currentAnswers = {};

      document.getElementById('chapters-list').classList.add('hidden');
      const detail = document.getElementById('chapter-detail');
      detail.classList.remove('hidden');

      detail.innerHTML = `
        <button class="back-btn" onclick="backToList()">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
          Retour aux chapitres
        </button>
        <div class="chapter-detail">
          <h2>${ch.title}</h2>
          <div class="chapter-detail-meta">
            <span>Duree: ${ch.duration || '30 min'}</span>
            <span>${ch.quiz?.length || 0} questions</span>
            <span>${ch.xpReward || 50} XP</span>
          </div>
          <div class="chapter-content">${renderMarkdown(ch.content)}</div>
          <div style="display:flex;gap:12px;margin-bottom:24px">
            <a href="${ch.summaryPdfUrl || '#'}" class="btn btn-secondary" target="_blank">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
              Telecharger le resume
            </a>
            <button class="btn btn-primary" onclick="markComplete('${ch.id}')" id="btn-complete-${ch.id}">
              Marquer comme termine
            </button>
          </div>
          <div class="quiz-section">
            <h3>Quiz - ${ch.title}</h3>
            <div id="quiz-container">
              ${(ch.quiz || []).map((q, qi) => `
                <div class="quiz-question" data-qi="${qi}">
                  <div class="quiz-q-text">${qi + 1}. ${q.question}</div>
                  <div class="quiz-options">
                    ${q.options.map((opt, oi) => `
                      <label class="quiz-option" id="opt-${qi}-${oi}">
                        <input type="radio" name="q${qi}" value="${oi}" onchange="selectAnswer('${qi}', ${oi})">
                        <span>${opt}</span>
                      </label>
                    `).join('')}
                  </div>
                  <div class="quiz-result hidden" id="result-${qi}"></div>
                </div>
              `).join('')}
            </div>
            <button class="btn btn-primary" onclick="submitQuiz('${ch.id}')" id="btn-submit-quiz">Soumettre le quiz</button>
            <div id="quiz-summary" style="margin-top:16px"></div>
          </div>
        </div>
      `;

      setChapterProgress(id, 50);
    }

    function backToList() {
      document.getElementById('chapter-detail').classList.add('hidden');
      document.getElementById('chapters-list').classList.remove('hidden');
      loadChapters();
    }

    function selectAnswer(qi, oi) {
      currentAnswers[qi] = oi;
      document.querySelectorAll(`[name="q${qi}"]`).forEach((el, idx) => {
        const label = document.getElementById(`opt-${qi}-${idx}`);
        label.classList.toggle('selected', idx === oi);
      });
    }

    async function submitQuiz(chapterId) {
      const ch = chaptersData.find(c => c.id === chapterId);
      if (!ch) return;

      const answers = ch.quiz.map((_, qi) => currentAnswers[qi] !== undefined ? currentAnswers[qi] : -1);
      if (answers.includes(-1)) {
        alert('Veuillez repondre a toutes les questions.');
        return;
      }

      const btn = document.getElementById('btn-submit-quiz');
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> Correction...';

      try {
        const result = await apiService.courses.submitQuiz(chapterId, answers);
        const user = getUser();

        ch.quiz.forEach((q, qi) => {
          const res = result.results[qi];
          const resultDiv = document.getElementById(`result-${qi}`);
          resultDiv.classList.remove('hidden');
          resultDiv.className = `quiz-result ${res.correct ? 'correct' : 'incorrect'}`;
          resultDiv.innerHTML = `<strong>${res.correct ? 'Correct !' : 'Incorrect'}</strong> ${res.explanation}`;

          q.options.forEach((_, oi) => {
            const label = document.getElementById(`opt-${qi}-${oi}`);
            label.classList.remove('selected');
            if (oi === q.correctIndex) label.classList.add('correct');
            else if (oi === answers[qi] && !res.correct) label.classList.add('incorrect');
            label.querySelector('input').disabled = true;
          });
        });

        if (result.passed && user) {
          if (!user.completedChapters.includes(chapterId)) {
            user.completedChapters.push(chapterId);
            user.xp = (user.xp || 0) + 30;
            user.quizScores = user.quizScores || [];
            user.quizScores.push({ chapterId, score: result.score, date: new Date() });
            localStorage.setItem('user', JSON.stringify(user));
            await apiService.progress.completeChapter(chapterId).catch(() => {});
          }
        }

        document.getElementById('quiz-summary').innerHTML = `
          <div class="alert alert-${result.passed ? 'success' : 'error'}">
            Score: <strong>${result.score}%</strong> (${result.correct}/${result.total}) - ${result.passed ? 'Quiz reussi ! +30 XP' : 'Il faut 70% pour reussir.'}
          </div>
        `;

        setChapterProgress(chapterId, 100);
        btn.style.display = 'none';
      } catch (e) {
        btn.disabled = false;
        btn.textContent = 'Soumettre le quiz';
        alert('Erreur: ' + e.message);
      }
    }

    async function markComplete(chapterId) {
      const user = getUser();
      if (!user) {
        alert('Connectez-vous pour enregistrer votre progression.');
        return;
      }
      if (!user.completedChapters.includes(chapterId)) {
        try {
          await apiService.progress.completeChapter(chapterId);
          user.completedChapters.push(chapterId);
          user.xp = (user.xp || 0) + 50;
          localStorage.setItem('user', JSON.stringify(user));
          document.getElementById(`btn-complete-${chapterId}`).textContent = 'Termine !';
          document.getElementById(`btn-complete-${chapterId}`).disabled = true;
          setChapterProgress(chapterId, 100);
        } catch (e) {
          alert('Erreur: ' + e.message);
        }
      }
    }

    loadChapters();
  </script>
</body>
</html>
