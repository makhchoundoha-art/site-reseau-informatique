<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Reseaux Informatiques</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      padding: 20px;
    }
    .auth-card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-logo a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.1rem;
      color: #0F172A;
    }
    .auth-logo span {
      width: 36px;
      height: 36px;
      background: #3B82F6;
      color: white;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-card h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0F172A;
      margin-bottom: 8px;
      text-align: center;
    }
    .auth-card .subtitle {
      text-align: center;
      color: #64748B;
      font-size: 0.9rem;
      margin-bottom: 28px;
    }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.85rem;
      color: #64748B;
    }
    .auth-footer a {
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <a href="/">
          <span>R</span>
          Reseaux Informatiques
        </a>
      </div>
      <h1>Connexion</h1>
      <p class="subtitle">Connectez-vous pour acceder a votre progression</p>
      <div id="alert"></div>
      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="email" placeholder="votre@email.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Mot de passe</label>
          <input type="password" class="form-input" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%" id="submit-btn">
          Se connecter
        </button>
      </form>
      <div class="auth-footer">
        Pas encore de compte ? <a href="/pages/register.html">S'inscrire</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const alertDiv = document.getElementById('alert');
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> Connexion...';

      try {
        const data = await apiService.auth.login({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        });
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/pages/dashboard.html';
      } catch (err) {
        alertDiv.innerHTML = `<div class="alert alert-error">${err.message || 'Email ou mot de passe incorrect'}</div>`;
        btn.disabled = false;
        btn.textContent = 'Se connecter';
      }
    });
  </script>
</body>
</html>
