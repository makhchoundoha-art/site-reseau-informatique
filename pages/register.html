<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription - Reseaux Informatiques</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      padding: 20px;
    }
    .auth-card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-logo a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.1rem;
      color: #0F172A;
    }
    .auth-logo span {
      width: 36px;
      height: 36px;
      background: #3B82F6;
      color: white;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-card h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0F172A;
      margin-bottom: 8px;
      text-align: center;
    }
    .auth-card .subtitle {
      text-align: center;
      color: #64748B;
      font-size: 0.9rem;
      margin-bottom: 28px;
    }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.85rem;
      color: #64748B;
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <a href="/">
          <span>R</span>
          Reseaux Informatiques
        </a>
      </div>
      <h1>Inscription</h1>
      <p class="subtitle">Creez votre compte pour commencer a apprendre</p>
      <div id="alert"></div>
      <form id="register-form">
        <div class="form-group">
          <label class="form-label">Nom d'utilisateur</label>
          <input type="text" class="form-input" id="username" placeholder="votre_pseudo" required minlength="3">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="email" placeholder="votre@email.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Mot de passe</label>
          <input type="password" class="form-input" id="password" placeholder="6 caracteres minimum" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%" id="submit-btn">
          S'inscrire
        </button>
      </form>
      <div class="auth-footer">
        Deja un compte ? <a href="/pages/login.html">Se connecter</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const alertDiv = document.getElementById('alert');
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> Inscription...';

      try {
        const data = await apiService.auth.register({
          username: document.getElementById('username').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        });
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/pages/dashboard.html';
      } catch (err) {
        const msg = err.data?.errors?.[0]?.msg || err.message || 'Erreur lors de l inscription';
        alertDiv.innerHTML = `<div class="alert alert-error">${msg}</div>`;
        btn.disabled = false;
        btn.textContent = "S'inscrire";
      }
    });
  </script>
</body>
</html>
