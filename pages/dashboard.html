<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Reseaux Informatiques</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: white;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 24px;
    }
    .stat-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .stat-card-label {
      font-size: 0.85rem;
      color: #64748B;
      font-weight: 500;
    }
    .stat-card-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stat-card-icon.blue { background: #DBEAFE; color: #3B82F6; }
    .stat-card-icon.green { background: #D1FAE5; color: #10B981; }
    .stat-card-icon.yellow { background: #FEF3C7; color: #F59E0B; }
    .stat-card-icon.purple { background: #EDE9FE; color: #8B5CF6; }
    .stat-card-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: #0F172A;
    }
    .badges-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .badge-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #334155;
    }
    .badge-item.locked {
      opacity: 0.5;
    }
    .badge-item svg {
      width: 20px;
      height: 20px;
      color: #F59E0B;
    }
    .badge-item.locked svg {
      color: #94A3B8;
    }
    .activity-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .activity-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px;
      background: #F8FAFC;
      border-radius: 10px;
    }
    .activity-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-top: 6px;
      flex-shrink: 0;
    }
    .activity-dot.blue { background: #3B82F6; }
    .activity-dot.green { background: #10B981; }
    .activity-dot.yellow { background: #F59E0B; }
    .activity-text {
      font-size: 0.9rem;
      color: #334155;
    }
    .activity-date {
      font-size: 0.75rem;
      color: #94A3B8;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <a href="/">
          <span class="sidebar-brand-icon">R</span>
          Reseaux
        </a>
      </div>
      <nav class="sidebar-nav" id="auth-nav"></nav>
      <div class="sidebar-footer" id="sidebar-footer"></div>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <h2 class="top-bar-title">Dashboard</h2>
        <button class="mobile-toggle" onclick="toggleMobileSidebar()">
          <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>

      <div class="page-content">
        <div class="stats-row">
          <div class="stat-card">
            <div class="stat-card-header">
              <span class="stat-card-label">XP Total</span>
              <div class="stat-card-icon blue">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
              </div>
            </div>
            <div class="stat-card-value" id="stat-xp">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-header">
              <span class="stat-card-label">Chapitres</span>
              <div class="stat-card-icon green">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
              </div>
            </div>
            <div class="stat-card-value" id="stat-chapters">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-header">
              <span class="stat-card-label">Exercices</span>
              <div class="stat-card-icon yellow">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
              </div>
            </div>
            <div class="stat-card-value" id="stat-exercises">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-header">
              <span class="stat-card-label">Serie</span>
              <div class="stat-card-icon purple">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"/></svg>
              </div>
            </div>
            <div class="stat-card-value" id="stat-streak">0</div>
          </div>
        </div>

        <div class="grid-2">
          <div class="card">
            <h3 class="card-title">Badges</h3>
            <div class="badges-grid" id="badges-container">
              <p class="card-text">Chargement...</p>
            </div>
          </div>
          <div class="card">
            <h3 class="card-title">Activite recente</h3>
            <div class="activity-list" id="activity-container">
              <p class="card-text">Chargement...</p>
            </div>
          </div>
        </div>

        <div class="card mt-4">
          <h3 class="card-title">Progression des quiz</h3>
          <div id="quiz-scores">
            <p class="card-text">Aucun quiz effectue pour le moment.</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script>
    requireAuth();

    const ALL_BADGES = [
      { id: 'OSI Master', name: 'OSI Master', desc: 'Completez le chapitre OSI' },
      { id: 'Subnet Pro', name: 'Subnet Pro', desc: 'Completez le chapitre IP' },
      { id: 'Security Expert', name: 'Security Expert', desc: 'Completez le chapitre Securite' },
      { id: 'Quiz Champion', name: 'Quiz Champion', desc: '100% a un quiz' },
      { id: 'Course Finisher', name: 'Course Finisher', desc: 'Completez tous les chapitres' }
    ];

    async function loadDashboard() {
      try {
        const user = getUser();
        if (!user) return;

        document.getElementById('stat-xp').textContent = user.xp || 0;
        document.getElementById('stat-chapters').textContent = (user.completedChapters || []).length;
        document.getElementById('stat-exercises').textContent = (user.exercisesSolved || []).length;
        document.getElementById('stat-streak').textContent = user.streak || 0;

        // Badges
        const badgesContainer = document.getElementById('badges-container');
        const earned = user.badges || [];
        badgesContainer.innerHTML = ALL_BADGES.map(b => {
          const isEarned = earned.includes(b.id);
          return `
            <div class="badge-item ${isEarned ? '' : 'locked'}">
              <svg fill="${isEarned ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>
              </svg>
              <span>${b.name}</span>
            </div>
          `;
        }).join('');

        // Activity
        const activityContainer = document.getElementById('activity-container');
        const activities = [];
        (user.quizScores || []).forEach(q => {
          activities.push({ type: 'green', text: `Quiz ${q.chapterId} - Score: ${q.score}%`, date: new Date(q.date) });
        });
        (user.completedChapters || []).forEach(c => {
          activities.push({ type: 'blue', text: `Chapitre complete: ${c}`, date: new Date() });
        });

        if (activities.length === 0) {
          activityContainer.innerHTML = '<p class="card-text">Aucune activite pour le moment.</p>';
        } else {
          activityContainer.innerHTML = activities.slice(0, 5).map(a => `
            <div class="activity-item">
              <div class="activity-dot ${a.type}"></div>
              <div>
                <div class="activity-text">${a.text}</div>
                <div class="activity-date">${formatDate(a.date)}</div>
              </div>
            </div>
          `).join('');
        }

        // Quiz scores
        const quizContainer = document.getElementById('quiz-scores');
        if (user.quizScores && user.quizScores.length > 0) {
          quizContainer.innerHTML = user.quizScores.map(q => `
            <div style="margin-bottom:16px">
              <div style="display:flex;justify-content:space-between;margin-bottom:6px">
                <span style="font-weight:500;font-size:0.9rem">${q.chapterId}</span>
                <span style="font-weight:600;color:${q.score >= 80 ? '#10B981' : q.score >= 60 ? '#F59E0B' : '#EF4444'}">${q.score}%</span>
              </div>
              <div class="progress-container"><div class="progress-fill" style="width:${q.score}%;background:${q.score >= 80 ? '#10B981' : q.score >= 60 ? '#F59E0B' : '#EF4444'}"></div></div>
            </div>
          `).join('');
        }
      } catch (e) {
        console.error(e);
      }
    }

    loadDashboard();
  </script>
</body>
</html>
